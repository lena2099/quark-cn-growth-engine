# 极地客户雷达 — 意图模式库
# 不是关键词匹配，而是消费意图识别

# ═══ 强意图信号（直接表露极地旅行需求）═══
strong_intent:
  polar_direct:
    score: 20
    patterns:
      - "南极.*旅游|旅行|邮轮|攻略|多少钱|怎么去|什么时候去"
      - "北极.*旅游|旅行|邮轮|攻略|去看极光|北极光"
      - "去.*南极|北极.*要花|需要.*准备"
      - "南极.*船|南极.*选.*船|南极.*邮轮.*推荐"
      - "夸克探险|Quark|夸克.*船|庞洛|银海.*邮轮|南极.*包船"
      - "IAATO|AECO|南极.*登陆|南极.*科考站"
      - "南极.*三岛|南极.*半岛|南极.*点|南乔治亚|福克兰"
      - "北极.*斯瓦尔巴|格陵兰.*旅行|北极.*破冰船"
      - "南极.*摄影|南极.*企鹅|南极.*冰川"
      - "极地.*探险|南北极.*旅行|两极.*都去"
      - "南极.*线路|帝企鹅|南极.*圈|罗斯.*海|威德尔"
      - "南极.*选择|选.*南极|南极.*区别|南极.*对比"
      - "直升机.*南极|南极.*直升机|南极.*飞机|飞.*南极"

  time_commitment:
    score: 15
    patterns:
      - "明年.*去|明年.*计划|后年.*旅行|退休.*去"
      - "30岁.*愿望|40岁.*清单|50岁.*梦想|60岁.*心愿"
      - "存钱.*去|攒钱.*去|开始.*存.*南极"
      - "提前.*一年.*订|现在.*订.*明年"
      - "人生.*最后.*大陆|世界.*尽头|地球.*最后"

  social_proof:
    score: 10
    patterns:
      - "朋友.*去.*南极|同事.*去.*南极|老板.*去.*南极"
      - "某某.*去了.*南极|看到.*南极.*照片|南极.*回来"
      - "推荐.*南极|南极.*值得|南极.*值得去"
      - "南极.*太.*震撼|南极.*此生.*必去|南极.*不虚此行"
      - "朋友.*坐.*夸克|看到.*夸克.*船|夸克.*直升|听说.*夸克"
      - "朋友.*推荐.*邮轮|有.*去过.*推荐|去过的.*推荐"
      - "坐过.*推荐|体验过.*推荐|亲身.*经历.*推荐"

# ═══ 隐性意图信号（未提南极，但画像匹配）═══
implicit_intent:
  travel_upgrade:
    score: 12
    patterns:
      - "环球旅行|环游世界|七大洲|去了.*50.*个国家"
      - "极致旅行|一生一次|Bucket.*List|人生清单"
      - "小众.*旅行|深度.*旅行|探险.*旅行|奢旅"
      - "非洲.*Safari|冰岛.*极光|阿拉斯加|大溪地"
      - "加拉帕戈斯|亚马逊.*探险|北极圈|挪威.*峡湾"
      - "不再.*打卡|不想.*走马观花|追求.*体验|体验式.*旅行"
      - "私人.*定制.*旅行|专属.*行程|管家式.*旅行"

  photography_enthusiast:
    score: 8
    patterns:
      - "摄影.*旅行|旅拍|航拍.*旅行|拍.*企鹅|拍.*极光"
      - "风光.*摄影|野生动物.*摄影|自然.*摄影"
      - "大疆.*旅行|哈苏|徕卡.*旅行|长焦.*旅行"
      - "摄影.*团|摄影.*向导|摄影.*路线|摄影.*目的地"
      - "无人机.*旅行|延时.*摄影|星空.*摄影"

  science_education:
    score: 8
    patterns:
      - "科考.*旅行|科学家.*带队|科研.*考察"
      - "孩子.*开阔.*眼界|教育.*旅行|亲子.*国际"
      - "地质.*旅行|冰川.*考察|海洋.*生物|生态.*旅行"
      - "气候变化|全球变暖|环境保护.*旅行|可持续.*旅行"

  life_stage:
    score: 10
    patterns:
      - "退休.*旅行|退休.*生活|退休.*计划|退休.*第一"
      - "辞职.*旅行|裸辞.*环游|间隔年|gap.*year"
      - "50岁|60岁|人到中年|孩子.*上大学.*旅行"
      - "创业.*退出|财务自由|FIRE.*生活|提前退休"
      - "公司.*卖了|IPO.*之后|套现.*旅行"

  luxury_lifestyle:
    score: 10
    patterns:
      - "私人飞机|公务机|包机.*旅行"
      - "米其林.*旅行|顶级酒店|安缦|宝格丽.*酒店"
      - "劳斯莱斯|宾利|保时捷.*旅行|跑车.*自驾"
      - "游艇|帆船.*旅行|私人.*游艇"
      - "头等舱|商务舱.*国际|航空公司.*金卡"
      - "葡萄酒.*之旅|威士忌.*之旅|雪茄.*俱乐部"

# ═══ 财富信号（不依赖旅行内容，纯身份识别）═══
wealth_signals:
  business_owner:
    score: 20
    patterns:
      - "创始人|CEO|董事长|合伙人|创始人.*兼"
      - "公司.*上市|IPO|融资.*亿|估值.*亿"
      - "创业.*记|连续.*创业|天使.*投资|VC"
      - "老板.*日常|管理.*团队|开会.*董事"
      - "我的.*员工|我的.*公司|我们.*公司.*年"
      - "自贸区|跨境.*业务|出海|全球化.*业务"
      - "企业主|把公司.*交|公司.*经理人|自己.*生意|经营.*公司"
      - "自己.*工厂|实体.*企业|传统.*行业.*老板"
      - "公司.*年.*营收|年.*利润.*万|公司.*规模"
      - "白手起家|从零.*到.*公司|一手.*创办"
      - "财务自由|已经.*不.*上班|不需要.*工作"

  executive:
    score: 15
    patterns:
      - "VP|副总裁|总监|总经理|CDO|CTO|CFO|COO|MD|Managing.*Director"
      - "大厂.*工作|互联网.*中层|金融.*高管|投行"
      - "年薪.*百万|年薪.*万|package.*万"
      - "股权.*激励|期权.*变现|RSU|ESPP"
      - "咨询.*合伙人|律所.*合伙人|投行.*MD"
      - "管.*百人.*团队|带.*团队.*年|区域.*总"
      - "GM|General.*Manager|Director.*of|Head.*of"
      - "飞了.*80.*段|飞了.*100.*段|飞行.*里程.*百万"

  professional:
    score: 10
    patterns:
      - "医生|主治|主任.*医师|三甲|外科.*专家"
      - "律师|律所.*合伙人|法律.*顾问"
      - "教授|副教授|研究员|博导|长江.*学者"
      - "高级.*工程师|首席.*科学家|技术.*专家"

  asset_signals:
    score: 15
    patterns:
      - "买房.*记录|别墅.*装修|大平层|豪宅"
      - "房产.*投资|海外.*置业|移民.*规划"
      - "私行.*客户|私人银行|财富管理.*专属"
      - "家族.*办公室|家办|信托.*规划"
      - "用车:保时捷|提车:奔驰|配车:宝马7系"
      - "高尔夫.*会员|马术|帆船.*俱乐部"
      - "黑卡|无限卡|百夫长|运通.*黑金"

  travel_history:
    score: 12
    patterns:
      - "去过.*南极|去过.*北极|去过.*南美|去过.*肯尼亚"
      - "去了.*30.*个国家|去了.*50.*个国家|去了.*100.*个国家"
      - "每年.*出国.*旅行|每年.*两次.*国外|常年.*国际"
      - "常去.*瑞士|常去.*日本|常去.*法国|常去.*北欧"
      - "已经.*走遍.*五大洲|就差.*南极|还剩.*南极"
      - "护照.*页.*快.*满|签证.*记录|十年.*美签|申根.*五年"

# ═══ 负面信号（降低评分）═══
negative_signals:
  budget_sensitive:
    score: -15
    patterns:
      - "太贵|好贵|消费不起|贫穷.*限制|预算.*有限"
      - "没钱|买不起|太奢侈|有钱.*才去|有钱人.*玩"
      - "穷游|省钱.*旅行|最低.*预算|怎么.*省钱"
      - "学生党|刚毕业|刚工作|月薪.*千|收入.*低"

  casual_traveler:
    score: -10
    patterns:
      - "跟团|低价团|购物团|零团费|免费.*游"
      - "想去.*但.*太远|想去.*但.*太冷|怕冷|晕船"
      - "随便.*逛逛|走马观花|到此一游|打卡.*就好"
      - "国内.*就.*够|不需要.*出国|不喜欢.*远"

  negative_sentiment:
    score: -20
    patterns:
      - "南极.*破坏.*环境|极地.*旅游.*污染|碳排放"
      - "南极.*不要去|南极.*危险|南极.*死了"
      - "极地.*旅游.*炒作|南极.*智商税|骗钱"

# ═══ 平台特有信号 ═══
platform_signals:
  xiaohongshu:
    save_count_weight: 0.5        # 收藏权重
    comment_quality_weight: 1.0   # 评论质量（>50字的评论更值钱）
    follow_travel_account: 5      # 关注旅行账号
    bookmark_folder: 10           # 创建"南极"收藏夹

  douyin:
    dwell_time_30s_plus: 8        # 停留>30秒
    complete_rate: 10             # 完播率
    share_count: 5                # 分享数
    comment_intent: 10            # 评论中表达意图
    follow_from_video: 8          # 看视频后关注

  wechat:
    article_read_complete: 8      # 读完南极文章
    article_share: 10             # 分享南极文章
    mini_program_visit: 12        # 访问小程序
    wecom_add: 15                 # 添加企业微信
    community_join: 20            # 加入极地社群
